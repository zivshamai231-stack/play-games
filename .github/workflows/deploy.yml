name: Check and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      event:
        description: "Which party to put online (a file in src/content, without .ts)"
        required: true
        default: birthday-demo
      admin_key:
        description: "The host's code for this party (first deploy only; leave empty to keep the current one)"
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build

  # Puts one party online, when started by hand (Actions → Check and deploy → Run workflow).
  # Each party gets its own address: party-<event>.<account>.workers.dev
  # Needs two repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: No Cloudflare secrets here, skipping deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the repository secrets to deploy."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - name: Keep the host code out of the logs
        if: env.CLOUDFLARE_API_TOKEN != '' && inputs.admin_key != ''
        run: echo "::add-mask::${{ inputs.admin_key }}"
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bash scripts/deploy-event.sh "${{ inputs.event }}" "${{ inputs.admin_key }}"
